<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI Excel Assistant</title>

  <!-- Office.js -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <style>
    body {
      font-family: Segoe UI, Arial, sans-serif;
      padding: 12px;
    }
    textarea, input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
    }
    textarea {
      height: 90px;
    }
    button {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      font-weight: 600;
    }
    .small {
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>
  <h3>AI Excel Assistant</h3>

  <label>API Key</label>
  <input type="password" id="apiKey" placeholder="Enter API key" />

  <label>Prompt</label>
  <textarea id="prompt" placeholder="Ask something about your sheet..."></textarea>

  <button onclick="runAI()">Run</button>

  <p class="small">
    Result will be written to the selected cell.
  </p>

<script>
Office.onReady(() => {
  console.log("Office ready");
});

async function runAI() {
  const apiKey = document.getElementById("apiKey").value;
  const prompt = document.getElementById("prompt").value;

  if (!apiKey || !prompt) {
    alert("API key and prompt are required");
    return;
  }

  try {
    const response = await fetch(
      "https://gateway-dev.apim.alfuttaim.com/ai-hub-gw/openai/deployments/gpt-4o-global/chat/completions?api-version=2024-05-01-preview",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "api-key": apiKey
        },
        body: JSON.stringify({
          model: "gpt-4o-global",
          messages: [
            { role: "system", content: "You are an Excel assistant." },
            { role: "user", content: prompt }
          ]
        })
      }
    );


    if (!response.ok) {
    alert("HTTP error: " + response.status);
    return;
    }
    const data = await response.json();
    const text =
      data?.choices?.[0]?.message?.content || "No response";

    await writeToExcel(text);

  } catch (err) {
    alert("Error: " + err.message);
  }
}

async function writeToExcel(text) {
  await Excel.run(async (context) => {
    const range = context.workbook.getSelectedRange();
    range.values = [[text]];
    range.format.wrapText = true;
    await context.sync();
  });
}
</script>

</body>
</html>
